<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f3f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15171b" media="(prefers-color-scheme: dark)">
<title>agentikeys</title>
<style nonce="__NONCE__">
:root {
  --bg: #f3f5f7; --panel: #ffffff; --ink: #1a1d23; --muted: #5b6270; --line: #dde1e7;
  --accent: #0e6b63; --accent-ink: #ffffff; --dest: #e8f2f0; --warn: #8a5300; --danger: #b3261e;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Ubuntu, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15171b; --panel: #1d2025; --ink: #e9ebee; --muted: #9aa1ad; --line: #30343b;
    --accent: #4db3a7; --accent-ink: #0b1f1d; --dest: #1b2b29; --warn: #e0a84a; --danger: #f2827a;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
  font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased;
  display: flex; align-items: flex-start; justify-content: center; padding: 8vh 16px 48px;
}
main {
  width: 100%; max-width: 520px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 14px; padding: 28px 28px 24px;
}
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 18px; flex-wrap: wrap; }
.brand { font-size: 13px; color: var(--muted); margin: 0; display: flex; align-items: center; gap: 7px; }
.brand svg { color: var(--accent); }
.phrase {
  font: 600 12.5px/1 var(--mono); color: var(--accent); border: 1px solid var(--accent); border-radius: 999px;
  padding: 5px 10px; white-space: nowrap;
}
.phrase-intro { font-size: 13px; background: var(--dest); border-radius: 8px; padding: 10px 12px; margin: 0 0 18px; }
.phrase-intro strong { font-family: var(--mono); }
.banner code { font-family: var(--mono); font-size: 13px; }
h1 { text-wrap: balance; font-size: 22px; line-height: 1.25; font-weight: 650; letter-spacing: -0.01em; margin: 0 0 8px; }
.reason { color: var(--muted); margin: 0 0 20px; white-space: pre-wrap; }
.places { border: 0; margin: 4px 0 0; padding: 0; min-width: 0; }
.places legend { font-weight: 600; padding: 0; margin: 0 0 8px; }
.place {
  display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; align-items: start; cursor: pointer;
  border: 1px solid var(--line); border-left-width: 3px; border-radius: 4px 10px 10px 4px;
  padding: 11px 14px; margin: 0 0 8px; transition: background-color 120ms, border-color 120ms;
}
.place:has(input:checked) { background: var(--dest); border-color: var(--accent); }
.place:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.place.off { cursor: default; }
.place.off .svc, .place.off .where { color: var(--muted); }
.place input[type="checkbox"] { grid-row: span 4; margin: 3px 0 0; width: 16px; height: 16px; accent-color: var(--accent); }
.place .svc { font-weight: 600; }
.place .where { font-family: var(--mono); font-size: 13px; word-break: break-all; }
.place .detail, .place .names { font-size: 13px; color: var(--muted); }
.place .problem { font-size: 13px; color: var(--warn); }
.place .done { font-size: 13px; color: var(--accent); font-weight: 600; }
.place .pick { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 13px; color: var(--muted); }
.place code, footer code { font-family: var(--mono); font-size: 12px; }
.place select {
  max-width: 100%; font: 14px/1.3 var(--sans); color: var(--ink);
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px;
}
.place select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
@media (prefers-reduced-motion: reduce) { .place { transition: none; } }
.field { margin: 0 0 18px; }
h1 + .reason { margin-bottom: 22px; }
.field-head { display: flex; align-items: baseline; gap: 8px; margin: 0 0 6px; }
.field-head label { font-weight: 600; }
.field-head .name { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.field-head .opt { font-size: 13px; color: var(--muted); }
.field-head a { margin-left: auto; font-size: 13px; color: var(--accent); text-underline-offset: 2px; }
.input-row { display: flex; gap: 8px; }
input {
  flex: 1; min-width: 0; font: 14px/1.4 var(--mono); color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
}
input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
input[aria-invalid="true"] { border-color: var(--danger); }
button {
  font: 600 14px/1 var(--sans); border-radius: 8px; padding: 11px 16px; cursor: pointer;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  touch-action: manipulation; transition: background-color 120ms, border-color 120ms;
}
button:hover:not(:disabled) { border-color: var(--muted); }
button.primary:hover:not(:disabled) { filter: brightness(1.08); }
@media (prefers-reduced-motion: reduce) { button { transition: none; } }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.reveal, button.upload { font-weight: 500; font-size: 13px; padding: 0 12px; min-width: 64px; color: var(--muted); }
.attached {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap; border: 1px dashed var(--line);
  border-radius: 8px; padding: 8px 8px 8px 12px; font-size: 14px;
}
.attached .what { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.attached button { padding: 7px 12px; font-size: 13px; font-weight: 500; }
.preview {
  margin: 8px 0 0; padding: 10px 12px; max-height: 220px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere;
  font: 12.5px/1.45 var(--mono); background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
}
.field.dropping .input-row input, .field.dropping .attached { border-color: var(--accent); border-style: solid; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button:disabled { opacity: 0.6; cursor: default; }
.msg { font-size: 13px; margin: 6px 0 0; }
.msg.error { color: var(--danger); }
.msg.warn { color: var(--warn); }
.banner { color: var(--danger); margin: 0 0 16px; }
footer { border-top: 1px solid var(--line); margin-top: 24px; padding-top: 18px; }
footer p { font-size: 13px; color: var(--muted); margin: 0 0 16px; }
footer p.note { margin-bottom: 10px; }
footer a { color: var(--accent); text-underline-offset: 2px; }
.actions { display: flex; justify-content: flex-end; gap: 10px; }
.done h1 { margin-bottom: 6px; }
.done p { color: var(--muted); margin: 0; }
@media (max-width: 480px) { main { padding: 22px 18px 18px; } body { padding-top: 16px; } }
</style>
</head>
<body>
<main id="app"></main>
<script type="application/json" id="data">__DATA__</script>
<script nonce="__NONCE__">
"use strict";
// Page data arrives sealed under the link's view key (except on Tailscale); see boot() at the bottom.
const RAW = JSON.parse(document.getElementById("data").textContent);
let DATA;
const app = document.getElementById("app");
const ICON_KEY = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="M10.8 12.2 20 3m-4 4 3 3m-6-1 2 2"/></svg>';

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "text") node.textContent = v;
    else if (k === "html") node.innerHTML = v; // only used for the constant icons above
    else node.setAttribute(k, v);
  }
  for (const c of children) if (c) node.append(c);
  return node;
}

function patternFor(f) {
  if (!f.pattern) return null;
  try { return new RegExp(f.pattern); } catch { return null; }
}

function render() {
  const inputs = [];
  const brand = el("p", { class: "brand", html: ICON_KEY });
  brand.append("agentikeys");
  // The security phrase: agents never see it, so a lookalike page can't show it.
  const phrase = el("span", {
    class: "phrase", translate: "no", text: DATA.phrase,
    title: "Your security phrase. Every real agentikeys page shows it.",
    "aria-label": `Your security phrase: ${DATA.phrase}`,
  });
  const top = el("div", { class: "top" }, brand, phrase);
  const places = placesEl();
  const banner = el("p", { class: "banner", role: "alert", hidden: "" });
  const form = el("form", { novalidate: "" });

  DATA.fields.forEach((f, i) => {
    const id = `f${i}`;
    const input = el("input", {
      id, name: f.name, type: "password", autocomplete: "off", spellcheck: "false", autocapitalize: "off",
      "aria-describedby": `${id}-msg`,
    });
    if (f.placeholder) input.placeholder = f.placeholder;
    const what = f.label || f.name;
    const reveal = el("button", { type: "button", class: "reveal", text: "Show", "aria-controls": id, "aria-label": `Show ${what}` });
    reveal.addEventListener("click", () => {
      const hidden = input.type === "password";
      input.type = hidden ? "text" : "password";
      reveal.textContent = hidden ? "Hide" : "Show";
      reveal.setAttribute("aria-label", `${reveal.textContent} ${what}`);
    });
    const head = el("div", { class: "field-head" }, el("label", { for: id, text: what }));
    if (f.label && f.label !== f.name) head.append(el("span", { class: "name", translate: "no", text: f.name }));
    if (f.optional) head.append(el("span", { class: "opt", text: "Optional" }));
    if (f.help_url) head.append(el("a", { href: f.help_url, target: "_blank", rel: "noopener noreferrer", text: "Where do I find this?" }));
    const msg = el("p", { class: "msg", id: `${id}-msg`, "aria-live": "polite" });
    const clearMsg = () => { input.removeAttribute("aria-invalid"); msg.textContent = ""; msg.className = "msg"; warned.delete(i); };
    input.addEventListener("input", clearMsg);

    // Multi-line values (PEM keys, JSON key files) can't live in a password input, so they're held
    // here exactly as pasted or uploaded, never trimmed.
    const st = { f, input, msg, attached: null };
    const picker = el("input", { type: "file", hidden: "", tabindex: "-1" });
    const upload = el("button", { type: "button", class: "upload", text: "Upload", "aria-label": `Upload a file for ${what}` });
    upload.addEventListener("click", () => picker.click());
    const row = el("div", { class: "input-row" }, input, reveal, upload);
    const chip = el("div", { class: "attached", hidden: "" });
    const preview = el("pre", { class: "preview", hidden: "", translate: "no" });
    const attach = (text, label) => {
      clearMsg();
      st.attached = text;
      input.value = "";
      const show = el("button", { type: "button", text: "Show" });
      show.addEventListener("click", () => {
        preview.hidden = !preview.hidden;
        preview.textContent = preview.hidden ? "" : st.attached;
        show.textContent = preview.hidden ? "Show" : "Hide";
      });
      const remove = el("button", { type: "button", text: "Remove", "aria-label": `Remove the value for ${what}` });
      remove.addEventListener("click", () => {
        st.attached = null;
        preview.hidden = true;
        preview.textContent = "";
        chip.hidden = true;
        row.hidden = false;
        input.focus();
      });
      chip.replaceChildren(el("span", { class: "what", text: label }), show, remove);
      row.hidden = true;
      chip.hidden = false;
      show.focus();
    };
    const size = (n) => (n < 1024 ? `${n} bytes` : `${(n / 1024).toFixed(1)} KB`);
    const readFile = async (file) => {
      if (!file) return;
      if (file.size > 256 * 1024) {
        msg.className = "msg error";
        msg.textContent = "That file is over 256 KB, which is too big for a key.";
        return;
      }
      try {
        const text = new TextDecoder("utf-8", { fatal: true }).decode(await file.arrayBuffer());
        attach(text, `${file.name} · ${size(file.size)}`);
      } catch {
        msg.className = "msg error";
        msg.textContent = "That file isn't text. Keys in binary formats aren't supported yet.";
      }
    };
    picker.addEventListener("change", () => { readFile(picker.files[0]); picker.value = ""; });
    input.addEventListener("paste", (e) => {
      const text = e.clipboardData.getData("text");
      if (!/\r|\n/.test(text.replace(/\s+$/, ""))) return;
      e.preventDefault();
      const lines = text.replace(/\s+$/, "").split(/\r?\n/).length;
      attach(text, `Pasted ${lines} lines · ${size(new TextEncoder().encode(text).length)}`);
    });
    const field = el("div", { class: "field" }, head, row, chip, preview, msg, picker);
    field.addEventListener("dragover", (e) => { e.preventDefault(); field.classList.add("dropping"); });
    field.addEventListener("dragleave", () => field.classList.remove("dropping"));
    field.addEventListener("drop", (e) => { e.preventDefault(); field.classList.remove("dropping"); readFile(e.dataTransfer.files[0]); });
    form.append(field);
    inputs.push(st);
  });

  const n = DATA.fields.length;
  const save = el("button", { type: "submit", class: "primary", text: n === 1 ? "Save key" : `Save ${n} keys` });
  const cancel = el("button", { type: "button", text: "Cancel" });
  form.append(places.el);
  form.append(el("footer", {},
    DATA.note ? noteEl() : null,
    el("p", { text: "Your agent learns which keys were saved, never what you typed." }),
    el("div", { class: "actions" }, cancel, save)));

  const warned = new Set();
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    banner.hidden = true;
    const values = {};
    let blocked = false;
    inputs.forEach(({ f, input, msg, attached }, i) => {
      const v = attached !== null && attached.trim() ? attached : input.value.trim();
      if (!v) {
        if (!f.optional) {
          input.setAttribute("aria-invalid", "true");
          msg.className = "msg error";
          msg.textContent = "Enter a value, or cancel if you don't have one.";
          blocked = true;
        }
        return;
      }
      const re = patternFor(f);
      if (attached === null && re && !re.test(v) && !warned.has(i)) {
        msg.className = "msg warn";
        msg.textContent = "This doesn't match the format your agent expected. Check it, or save again to keep it.";
        warned.add(i);
        blocked = true;
      }
      values[f.name] = v;
    });
    if (blocked) {
      const first = inputs.find(({ msg }) => msg.textContent);
      if (first) first.input.focus();
      return;
    }
    const picks = places.picks();
    if (!picks.length) {
      banner.textContent = places.anyDone() ? "Everything you picked is saved. Pick another place, or close this tab." : "Pick at least one place to save to.";
      banner.hidden = false;
      return;
    }
    save.disabled = cancel.disabled = true;
    const label = save.textContent;
    save.textContent = "Saving…";
    let body;
    try {
      const submission = { values, places: picks };
      body = DATA.encrypt ? { sealed: await seal(submission) } : submission;
    } catch {
      body = null;
    }
    if (!body) {
      banner.textContent = "Couldn't encrypt the values in this browser. Try a current version of Chrome, Safari, Firefox or Edge.";
      banner.hidden = false;
      save.textContent = label;
      save.disabled = cancel.disabled = false;
      return;
    }
    const res = await post("submit", body);
    places.markDone(res.body.done || []);
    if (res.ok) {
      inputs.forEach((st) => { st.input.value = ""; st.attached = null; });
      const saved = res.body.saved.length;
      finish("Saved", `${saved === 1 ? "1 key" : saved + " keys"} saved to ${places.doneNames()}. You can close this tab and go back to your chat.`);
    } else {
      banner.replaceChildren();
      withCode(banner, res.body.error || "The connection dropped before agentikeys confirmed the save. Your agent can check whether it went through.");
      banner.hidden = false;
      save.textContent = label;
      save.disabled = cancel.disabled = false;
    }
  });

  cancel.addEventListener("click", async () => {
    save.disabled = cancel.disabled = true;
    await post("cancel", {});
    finish("Cancelled", "Nothing was saved. You can close this tab and go back to your chat.");
  });

  app.append(top);
  if (DATA.phrase_new) {
    const intro = el("p", { class: "phrase-intro" }, "Your security phrase is ", el("strong", { translate: "no", text: DATA.phrase }),
      ". Every real agentikeys page shows it in this corner. If a page ever asks for your keys without it, close it.");
    app.append(intro);
  }
  app.append(el("h1", { text: DATA.title }));
  if (DATA.reason) app.append(el("p", { class: "reason", text: DATA.reason }));
  app.append(banner, form);
  inputs[0].input.focus();
}

// Appends `text` to `node`, rendering `backticked` parts as code.
function withCode(node, text, linkify = (part) => [part]) {
  for (const part of text.split(/(`[^`]+`)/)) {
    if (part.startsWith("`")) node.append(el("code", { text: part.slice(1, -1) }));
    else node.append(...linkify(part));
  }
  return node;
}

// Tunnel note: `code` spans and the Tailscale link rendered properly.
function noteEl() {
  const link = "Tailscale (https://tailscale.com/download)";
  return withCode(el("p", { class: "note" }), DATA.note, (part) => {
    const [before, after] = part.split(link);
    if (after === undefined) return [before];
    return [before, el("a", { href: "https://tailscale.com/download", target: "_blank", rel: "noopener noreferrer", text: "Tailscale" }), after];
  });
}

// "Save to": one checkbox row per place the values can go.
function placesEl() {
  const rows = [];
  const fieldset = el("fieldset", { class: "places" }, el("legend", { text: "Save to" }));
  DATA.places.forEach((p, i) => {
    const off = !!p.problem;
    const box = el("input", { type: "checkbox", id: `p${i}`, name: "place", value: p.id });
    box.checked = !!p.selected && !off;
    box.disabled = off;
    const row = el("label", { class: off ? "place off" : "place", for: `p${i}` }, box, el("span", { class: "svc", text: p.service }));
    if (p.location) row.append(el("span", { class: "where", translate: "no", text: p.location }));
    if (p.detail) row.append(el("span", { class: "detail", text: p.detail }));
    let select = null;
    if (p.choice_label && p.choices.length && !off) {
      select = el("select", { id: `p${i}-choice`, translate: "no" });
      for (const c of p.choices) select.append(el("option", { value: c, text: c }));
      if (p.default_choice) select.value = p.default_choice;
      select.addEventListener("change", () => { box.checked = true; });
      row.append(el("span", { class: "pick" }, el("span", { text: p.choice_label }), select));
      select.setAttribute("aria-label", `${p.choice_label} for ${p.service}`);
    }
    if (p.names) row.append(el("span", { class: "names", text: p.names }));
    if (off) row.append(withCode(el("span", { class: "problem" }), p.problem));
    const status = el("span", { class: "done", "aria-live": "polite" });
    row.append(status);
    fieldset.append(row);
    rows.push({ p, box, select, status, done: false });
  });
  const label = (r) => r.select ? `${r.p.service} (${r.select.value})` : r.p.location || r.p.service;
  return {
    el: fieldset,
    picks: () => rows.filter((r) => r.box.checked && !r.done).map((r) => ({ id: r.p.id, choice: r.select ? r.select.value : null })),
    markDone: (ids) => rows.filter((r) => ids.includes(r.p.id) && r.box.checked && !r.done).forEach((r) => {
      r.done = true;
      r.box.checked = false;
      r.box.disabled = true;
      if (r.select) r.select.disabled = true;
      r.status.textContent = "Saved";
    }),
    anyDone: () => rows.some((r) => r.done),
    doneNames: () => rows.filter((r) => r.done).map(label).join(" and "),
  };
}

const b64u = {
  enc: (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""),
  dec: (s) => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((s.length + 3) % 4)), (c) => c.charCodeAt(0)),
};

// Keys from the link's #fragment: k = agentikeys' public key (for values), v = the view key (everything else).
function linkParam(name) {
  const m = new RegExp(`(?:^#|&)${name}=([A-Za-z0-9_-]+)`).exec(location.hash);
  return m ? m[1] : null;
}
const hostKey = () => linkParam("k");

// AES-256-GCM under the view key, bound to this link's token. Mirrors ViewKey in src/seal.rs.
async function openView(box) {
  const key = await crypto.subtle.importKey("raw", b64u.dec(linkParam("v")), "AES-GCM", false, ["decrypt"]);
  const aad = new TextEncoder().encode(location.pathname.slice(1));
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64u.dec(box.iv), additionalData: aad }, key, b64u.dec(box.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}

// ECDH P-256 -> HKDF-SHA256 -> AES-256-GCM, bound to this link's token. Mirrors src/seal.rs.
async function seal(submission) {
  const subtle = crypto.subtle;
  const enc = new TextEncoder();
  const curve = { name: "ECDH", namedCurve: "P-256" };
  const recipient = await subtle.importKey("raw", b64u.dec(hostKey()), curve, false, []);
  const eph = await subtle.generateKey(curve, false, ["deriveBits"]);
  const bits = await subtle.deriveBits({ name: "ECDH", public: recipient }, eph.privateKey, 256);
  const hkdf = await subtle.importKey("raw", bits, "HKDF", false, ["deriveKey"]);
  const key = await subtle.deriveKey(
    { name: "HKDF", hash: "SHA-256", salt: new Uint8Array(0), info: enc.encode("agentikeys v1") },
    hkdf, { name: "AES-GCM", length: 256 }, false, ["encrypt"]);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const aad = enc.encode(location.pathname.slice(1));
  const ct = await subtle.encrypt({ name: "AES-GCM", iv, additionalData: aad }, key, enc.encode(JSON.stringify(submission)));
  return { epk: b64u.enc(await subtle.exportKey("raw", eph.publicKey)), iv: b64u.enc(iv), ct: b64u.enc(ct) };
}

async function post(action, body) {
  try {
    const r = await fetch(`${location.pathname}/${action}`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
    });
    let reply = await r.json().catch(() => ({}));
    if (reply.sealed) reply = await openView(reply.sealed).catch(() => ({}));
    return { ok: r.ok, body: reply };
  } catch {
    return { ok: false, body: { error: "agentikeys stopped. Ask your agent to start a new request." } };
  }
}

function finish(title, text) {
  app.replaceChildren(el("div", { class: "done", role: "status" }, el("h1", { text: title }), el("p", { text })));
  document.title = `agentikeys: ${title.toLowerCase()}`;
  window.close();
}

async function boot() {
  if (!RAW.sealed) {
    DATA = RAW;
    return render();
  }
  const problem = !linkParam("k") || !linkParam("v")
    ? "This link is missing its key. Copy the whole link from your chat, including the part after #."
    : !window.crypto || !crypto.subtle
      ? "This browser can't decrypt this page. Try a current version of Chrome, Safari, Firefox or Edge."
      : null;
  if (!problem) {
    try {
      DATA = await openView(RAW.sealed);
      return render();
    } catch {}
  }
  app.replaceChildren(el("p", { class: "banner", role: "alert",
    text: problem || "This link is damaged or incomplete. Copy the whole link from your chat, including the part after #." }));
}

// Pasting the full link into this tab only changes the #fragment, which doesn't reload the page.
addEventListener("hashchange", () => location.reload());
boot();
</script>
</body>
</html>
