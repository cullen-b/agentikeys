[package]
name = "agentikeys"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Let AI coding agents ask for API keys without the keys ever passing through the chat."
license = "MIT"
repository = "https://github.com/cullen-b/agentikeys"
readme = "README.md"
keywords = ["secrets", "api-keys", "ai-agents", "cli", "dotenv"]
categories = ["command-line-utilities", "cryptography"]

[dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.4.3"
p256 = { version = "0.14.0", features = ["ecdh"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
tiny_http = "0.12.0"
toml_edit = "0.25.17"
zeroize = "1.9.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
